name: CI

# Tests on every push and pull request; on main and on version tags, the
# gatewayd image published to GitHub's registry:
#
#   ghcr.io/kgma74/relaix-server:sha-<7>    every build of main
#   ghcr.io/kgma74/relaix-server:latest     the last build of main
#   ghcr.io/kgma74/relaix-server:1.2.3      a v1.2.3 tag (and :1.2)
#
#   docker run --rm -p 8080:8080 -p 9090:9090 --env-file .env ghcr.io/kgma74/relaix-server:latest
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/relaix-server

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: relaix
          POSTGRES_DB: relaix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # Not DATABASE_URL: gatewayd reads that one, and a config test checks it
      # refuses to start without a database.
      TEST_DSN: postgres://postgres:relaix@127.0.0.1:5432/relaix?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Dashboard (type-check and build)
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: ui

      - name: Format and vet
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))" || { gofmt -l $(git ls-files '*.go'); exit 1; }
          go vet ./...

      # The store's conformance suite runs against the schema the migrations
      # build, applied with the goose the module already depends on.
      - name: Migrate
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.27.3 -dir db/migrations postgres "$TEST_DSN" up

      - name: Test (with Postgres, under the race detector)
        env:
          RELAIX_TEST_DATABASE_URL: ${{ env.TEST_DSN }}
        run: go test -race -count=1 ./...

  image:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=relaix-server
            org.opencontainers.image.description=Relaix gateway: SMS and USSD through your own Android phones

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
